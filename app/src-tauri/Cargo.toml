[package]
name = "waifu-cute-desktop"
version = "0.1.0"
description = "Waifu Cute Desktop companion shell (Tauri 2)"
edition = "2021"

[lib]
name = "waifu_cute_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
